// Top-level build file where you can add configuration options common to all sub-projects/modules.

// Loaded before buildscript{} so that variables.gradle values (kotlinVersion)
// are available when resolving classpath dependencies below.
apply from: "variables.gradle"

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        // The native-agent plugin module is written in Kotlin (apply plugin:
        // 'kotlin-android'). Every other plugin in this shell is pure Java, so
        // the Kotlin toolchain was never on the classpath and Gradle failed at
        // CONFIGURATION time with "Plugin with id 'kotlin-android' not found".
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
