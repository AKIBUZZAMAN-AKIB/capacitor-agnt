apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// PhoneBuddy agent engine — public Apache-2.0 SDK (see native/NOTICE-PhoneBuddySDK.txt).
//
// The Rust library is prebuilt for every Android ABI by
// tools/agent-ffi/build-phonebuddy-all-abis.sh (see .github/workflows/phonebuddy-ffi.yml)
// and committed under android/src/main/jniLibs/<abi>/libphone_buddy_ffi.so, so an app
// build never needs Rust, cargo or the NDK.
android {
    namespace 'com.t6x.plugins.phonebuddy'
    compileSdk 36
    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 36
        // Keep JNA + the plugin classes intact for hosts that enable R8/minify.
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation project(':capacitor-android')
    // Same JNA the native-agent plugin uses: the C ABI is called directly, so the
    // app build needs no CMake/NDK step (upstream's own example uses a JNI shim).
    implementation 'net.java.dev.jna:jna:5.14.0@aar'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
