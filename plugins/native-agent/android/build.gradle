apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// Long-term memory (MemoryProviderImpl) is part of src/main/java now, so there is
// no optional source set and no conditional dependency left here: the plugin
// compiles and works on its own, in every host app.
//
android {
    namespace 'com.t6x.plugins.nativeagent'
    compileSdk 36
    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 36
        // Keep the UniFFI/JNA surface intact for host apps that enable R8/minify.
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation project(':capacitor-android')
    implementation 'net.java.dev.jna:jna:5.14.0@aar'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    // Background wakes run in a Worker the OS owns. WorkManager is already on the
    // classpath of every host app that uses @capacitor/background-runner, so this
    // only pins the API version this module compiles against; Gradle resolves the
    // single highest version at the app level. A host app that needs a different
    // one sets `workManagerVersion` in its root variables.gradle (the same knob
    // background-runner documents) — read from the root first, then this project,
    // so a `-PworkManagerVersion=` override works too.
    //
    // MINIMUM 2.8.0: NativeWakeScheduler calls WorkManager.isInitialized() to
    // initialise on demand when the host app has stripped the androidx.startup
    // provider. That API landed in 2.8.0, so an override below it will not
    // compile.
    def workManagerVersion = rootProject.findProperty('workManagerVersion')
        ?: project.findProperty('workManagerVersion')
        ?: '2.11.0'
    implementation "androidx.work:work-runtime:$workManagerVersion"
}
