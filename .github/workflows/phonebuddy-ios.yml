name: PhoneBuddy FFI — iOS xcframework (build from public source)

# The PhoneBuddy SDK publishes Rust source only — no iOS binaries — so the iOS
# half of the wake/surfaced-message engine is built here, on a macOS runner,
# from the pinned public tag (github.com/APUS-AI-Lab/PhoneBuddySDK @ v0.2.0,
# Apache-2.0) and committed back to the branch:
#
#   public source → device + simulator static archives (cbindgen header checked
#   byte-for-byte against the committed one) → PhoneBuddyFFI.xcframework
#
# That keeps the project rule: no private or opaque native dependency, and the
# iOS side can be rebuilt any time with one dispatch. Details:
# tools/agent-ffi/build-phonebuddy-ios-xcframework.sh --help
#
# Until this has run once, the repo still builds: plugins/phonebuddy-agent/
# Package.swift declares its binaryTarget only when the xcframework exists, and
# the Swift plugin then compiles its `#else` half (honest `unavailable` answers).

on:
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: 'PhoneBuddySDK git ref to build (tag/branch/commit)'
        required: false
        default: 'v0.2.0'
      sim_archs:
        description: 'Simulator architectures to build'
        required: false
        default: 'arm64'
        type: choice
        options: [arm64, 'arm64 x86_64']
      commit_result:
        description: 'Commit the rebuilt xcframework back to this branch'
        required: false
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - 'tools/agent-ffi/build-phonebuddy-ios-xcframework.sh'
      - 'plugins/phonebuddy-agent/native/include/phone_buddy.h'
      - '.github/workflows/phonebuddy-ios.yml'

permissions:
  contents: write

jobs:
  rebuild:
    name: Build PhoneBuddyFFI.xcframework from public source
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Report toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          rustc --version || true

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .ffi-cache/PhoneBuddySDK/target
          key: cargo-phonebuddy-ios-${{ inputs.sdk_ref || 'v0.2.0' }}-${{ hashFiles('plugins/phonebuddy-agent/native/include/phone_buddy.h') }}
          restore-keys: cargo-phonebuddy-ios-

      - name: Build the xcframework from the public SDK source
        env:
          SDK_REF: ${{ inputs.sdk_ref || 'v0.2.0' }}
          SIM_ARCHS: ${{ inputs.sim_archs || 'arm64' }}
        run: |
          set -euo pipefail
          bash tools/agent-ffi/build-phonebuddy-ios-xcframework.sh \
            --ref "$SDK_REF" --sim-archs "$SIM_ARCHS"

      - name: Verify what will be committed
        run: |
          set -euo pipefail
          PLUGIN=plugins/phonebuddy-agent
          XCF="$PLUGIN/ios/Frameworks/PhoneBuddyFFI.xcframework"

          # Slices, per-slice headers, the module map, MinimumOSVersion and the
          # complete exported C ABI — through the same verifier the build script
          # runs, so what is checked here is exactly what was checked there.
          #
          # This replaces a hand-rolled check that was wrong twice and turned a
          # *correct* library into a red build in run 35428594086:
          #
          #   * `nm -g "$lib" | grep -q " _pb_version$"`: `grep -q` exits at the
          #     first match while nm is still writing, nm dies of SIGPIPE, and
          #     `set -o pipefail` reports the successful match as a failed
          #     pipeline. machocheck.py never pipes nm's output.
          #   * a bare `nm` picked up from PATH may be GNU binutils nm, which
          #     cannot read a Mach-O archive (stderr was discarded, so every
          #     symbol looked missing). machocheck.py resolves `xcrun -f nm`.
          #
          # Its MinimumOSVersion rule is the same as the build script's: the key
          # may legitimately be absent (a Rust staticlib mixes the prebuilt std
          # objects with our IPHONEOS_DEPLOYMENT_TARGET=15.0 objects, so
          # xcodebuild cannot pin one value), but a *declared* value must be 15.0.
          python3 tools/agent-ffi/machocheck.py \
            --xcframework "$XCF" \
            --header "$PLUGIN/native/include/phone_buddy.h" \
            --symbol-prefix pb_ \
            --module-name phone_buddy_ffi \
            --lib-name libphone_buddy_ffi.a \
            --expect-slices ios-arm64 ios-arm64-simulator \
            --deployment-target 15.0

          echo "--- the header inside the slices declares the v2 streaming surface"
          python3 - "$PLUGIN" <<'PY'
          import pathlib, sys
          xcf = pathlib.Path(sys.argv[1]) / 'ios/Frameworks/PhoneBuddyFFI.xcframework'
          head = (xcf / 'ios-arm64' / 'Headers' / 'phone_buddy_ffi' / 'phone_buddy.h').read_text()
          for symbol in ('pb_engine_chat_v2', 'pb_engine_set_host_callbacks'):
              assert symbol in head, f'{symbol} is not declared by the committed header'
          print('  pb_engine_chat_v2, pb_engine_set_host_callbacks: declared')
          PY

          echo "--- the header the Swift plugin compiles against"
          diff -q "$PLUGIN/native/include/phone_buddy.h" "$PLUGIN/ios/Sources/phone_buddy_ffi/include/phone_buddy.h"

          echo "--- the plugin's Swift must call only symbols the header declares"
          python3 - "$PLUGIN" <<'PY'
          import pathlib, re, sys
          plugin = pathlib.Path(sys.argv[1])
          header = (plugin / 'native/include/phone_buddy.h').read_text()
          declared = set(re.findall(r'\b(pb_[a-z0-9_]+)\s*\(', header))
          swift = (plugin / 'ios/Sources/PhoneBuddyAgentPlugin/PhoneBuddyAgentPlugin.swift').read_text()
          called = set(re.findall(r'\b(pb_[a-z0-9_]+)\s*\(', swift))
          missing = sorted(called - declared)
          print('declared:', len(declared), '| called from Swift:', len(called), '| missing:', missing)
          assert not missing, missing
          PY

      - name: Commit the rebuilt xcframework
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_result || github.event_name == 'push' }}
        run: |
          set -euo pipefail
          git config user.name  "nativekit-ci"
          git config user.email "nativekit-ci@users.noreply.github.com"
          git add plugins/phonebuddy-agent/ios/Frameworks/PhoneBuddyFFI.xcframework
          if git diff --cached --quiet; then
            echo "nothing to commit — the committed xcframework already matches the SDK source"
            exit 0
          fi
          git commit -m "build(phonebuddy): build the iOS xcframework from the public SDK source"
          # Several workflows commit to main, so a bare `git push` races and dies
          # with "! [rejected] HEAD -> main (fetch first)". Rebase and retry.
          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin "${GITHUB_REF_NAME}"
            if ! git rebase --quiet "origin/${GITHUB_REF_NAME}"; then
              echo "::warning::rebase hit a conflict on attempt ${attempt}"
              git rebase --abort || true
              sleep $((attempt * 5))
              continue
            fi
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then pushed=1; break; fi
            echo "push rejected (attempt ${attempt}) — rebasing on the new tip and retrying"
            sleep $((attempt * 5))
          done
          [[ "$pushed" == "1" ]] || { echo "::error::could not push after 5 attempts"; exit 1; }
          echo "Committed: $(git rev-parse HEAD)"
