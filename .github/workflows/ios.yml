name: iOS validation and IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      create_ipa:
        description: Build and export a signed IPA (requires all documented iOS secrets)
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'

jobs:
  build:
    name: Compile iOS and optionally export IPA
    runs-on: macos-26
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          package-manager-cache: false

      - name: Select installed Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Validate configuration, types, tests, and staging
        run: npm run check

      - name: Stage trusted UI and synchronize native projects
        run: npm run ci:ios

      - name: Resolve Swift package dependencies
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -resolvePackageDependencies

      - name: Compile unsigned iOS Simulator app
        shell: bash
        # ARCHS=arm64: the native-agent Rust binary ships ios-arm64 and
        # ios-arm64-simulator slices only (the Rust FFI crate lives in a private
        # repo, so an x86_64 slice cannot be produced here). A generic Simulator
        # destination would also build x86_64 and fail to link with
        # "Undefined symbols for architecture x86_64". Apple Silicon runners and
        # simulators are arm64, so this loses no real coverage.
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            build

      - name: Require complete IPA secrets
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.create_ipa) || startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$IOS_CERTIFICATE_BASE64" ]] || missing+=(IOS_CERTIFICATE_BASE64)
          [[ -n "$IOS_CERTIFICATE_PASSWORD" ]] || missing+=(IOS_CERTIFICATE_PASSWORD)
          [[ -n "$IOS_PROVISIONING_PROFILE_BASE64" ]] || missing+=(IOS_PROVISIONING_PROFILE_BASE64)
          [[ -n "$IOS_EXPORT_OPTIONS_PLIST_BASE64" ]] || missing+=(IOS_EXPORT_OPTIONS_PLIST_BASE64)
          if (( ${#missing[@]} )); then
            printf 'Cannot create IPA. Missing GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Install Apple certificate and provisioning profile
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.create_ipa) || startsWith(github.ref, 'refs/tags/v') }}
        id: ios_signing
        shell: bash
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/nativekit-distribution.p12"
          profile="$RUNNER_TEMP/nativekit.mobileprovision"
          profile_plist="$RUNNER_TEMP/nativekit-profile.plist"
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          keychain="$RUNNER_TEMP/nativekit-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile"
          printf '%s' "$IOS_EXPORT_OPTIONS_PLIST_BASE64" | base64 --decode > "$export_options"
          chmod 600 "$certificate" "$profile" "$export_options"
          plutil -lint "$export_options"

          security cms -D -i "$profile" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          profile_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")"
          team_id="${IOS_TEAM_ID:-$profile_team}"
          if [[ -n "$IOS_TEAM_ID" && "$IOS_TEAM_ID" != "$profile_team" ]]; then
            echo "IOS_TEAM_ID does not match the provisioning profile TeamIdentifier." >&2
            exit 1
          fi

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"

          profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles_dir"
          installed_profile="$profiles_dir/$profile_uuid.mobileprovision"
          cp "$profile" "$installed_profile"

          printf 'PROFILE_UUID=%q\nPROFILE_NAME=%q\nTEAM_ID=%q\nKEYCHAIN_PATH=%q\nINSTALLED_PROFILE=%q\n' \
            "$profile_uuid" "$profile_name" "$team_id" "$keychain" "$installed_profile" \
            > "$RUNNER_TEMP/nativekit-signing.env"
          chmod 600 "$RUNNER_TEMP/nativekit-signing.env"
          echo "Provisioning profile installed for team $team_id."

      - name: Archive signed iOS app
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.create_ipa) || startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          IOS_CODE_SIGN_IDENTITY: ${{ secrets.IOS_CODE_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/nativekit-signing.env"
          identity="${IOS_CODE_SIGN_IDENTITY:-Apple Distribution}"
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NativeKit.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-Device" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$identity" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            clean archive

      - name: Export signed IPA
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.create_ipa) || startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ios-artifacts
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/NativeKit.xcarchive" \
            -exportPath "$PWD/ios-artifacts" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          test -n "$(find ios-artifacts -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/NativeKit.xcarchive/dSYMs" \
            ios-artifacts/NativeKit-dSYMs.zip
          (cd ios-artifacts && shasum -a 256 -- *.ipa NativeKit-dSYMs.zip > SHA256SUMS.txt)
          {
            echo '### iOS IPA artifacts'
            echo
            echo '```text'
            cat ios-artifacts/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA and dSYMs
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.create_ipa) || startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v6
        with:
          name: ios-ipa-${{ github.sha }}
          path: ios-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary Apple signing material
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -f "$RUNNER_TEMP/nativekit-signing.env" ]]; then
            source "$RUNNER_TEMP/nativekit-signing.env"
            security delete-keychain "$KEYCHAIN_PATH"
            rm -f "$INSTALLED_PROFILE"
          fi
          rm -f \
            "$RUNNER_TEMP/nativekit-distribution.p12" \
            "$RUNNER_TEMP/nativekit.mobileprovision" \
            "$RUNNER_TEMP/nativekit-profile.plist" \
            "$RUNNER_TEMP/ExportOptions.plist" \
            "$RUNNER_TEMP/nativekit-signing.env"
