name: PhoneBuddy FFI — build every Android ABI

# Builds libphone_buddy_ffi.so (PhoneBuddy SDK, Apache-2.0, PUBLIC source) for
# arm64-v8a + armeabi-v7a + x86_64 + x86, verifies every slice, and can commit
# them into plugins/phonebuddy-agent/android/src/main/jniLibs.
#
# No secrets, no private repositories: the SDK is fetched from GitHub at the
# pinned ref below (override with the `ref` input).
#
# See tools/agent-ffi/README.bn.md and docs/research/PHONEBUDDY-ENGINE-MIGRATION.bn.md

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'PhoneBuddy SDK git ref (tag/branch/sha)'
        required: false
        default: 'v0.2.0'
        type: string
      abis:
        description: 'Space-separated ABIs to build'
        required: false
        default: 'arm64-v8a armeabi-v7a x86_64 x86'
        type: string
      vendor_source:
        description: 'Also vendor the SDK source into third_party/ (offline-buildable repo)'
        required: false
        default: false
        type: boolean
      commit_slices:
        description: 'Commit the rebuilt .so slices back to this branch'
        required: false
        default: true
        type: boolean
      build_apk:
        description: 'Also build a debug APK and assert it contains every ABI'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'plugins/phonebuddy-agent/**'
      - 'tools/agent-ffi/build-phonebuddy-all-abis.sh'
      - '.github/workflows/phonebuddy-ffi.yml'

permissions:
  contents: write

concurrency:
  group: phonebuddy-ffi-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: '27.0.12077973'
  ABIS: ${{ inputs.abis || 'arm64-v8a armeabi-v7a x86_64 x86' }}
  SDK_REF: ${{ inputs.ref || 'v0.2.0' }}
  JNI_LIBS: plugins/phonebuddy-agent/android/src/main/jniLibs

jobs:
  build-slices:
    name: Build and verify .so slices
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Rust 1.94 with the four Android targets
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install sccache (upstream .cargo/config.toml requires the wrapper)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sccache || true

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .ffi-cache/PhoneBuddySDK

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMGR="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort -V | tail -n1 || true)"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" --install "ndk;${NDK_VERSION}" >/dev/null
          fi
          NDK="$SDK/ndk/${NDK_VERSION}"
          test -d "$NDK" || NDK="$(find "$SDK/ndk" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n1)"
          test -d "$NDK" || { echo "No Android NDK available on this runner." >&2; exit 1; }
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "Using NDK: $NDK"

      - name: Build every ABI
        shell: bash
        env:
          VENDOR_SOURCE: ${{ inputs.vendor_source }}
        run: |
          set -euo pipefail
          args=(--ref "$SDK_REF" --abis "$ABIS" --best-effort)
          if [ "${VENDOR_SOURCE:-false}" = "true" ]; then args+=(--vendor); fi
          tools/agent-ffi/build-phonebuddy-all-abis.sh "${args[@]}"

      - name: Verify ABI coverage (source tree)
        run: |
          tools/agent-ffi/verify-abis.sh --require-lib libphone_buddy_ffi.so --strict --jni "$JNI_LIBS"
          cat "$JNI_LIBS/abi-manifest.json"

      - name: Upload .so slices
        uses: actions/upload-artifact@v6
        with:
          name: phonebuddy-jniLibs-${{ github.sha }}
          path: ${{ env.JNI_LIBS }}/
          if-no-files-found: error
          retention-days: 30

      - name: Commit rebuilt slices back
        if: ${{ (inputs.commit_slices == true || github.event_name != 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A "$JNI_LIBS"
          if [ -d third_party/PhoneBuddySDK ]; then git add -A third_party/PhoneBuddySDK; fi
          git diff --cached --quiet && { echo "Nothing changed."; exit 0; }
          git commit -m "build(phonebuddy): FFI slices for [${ABIS}] @ ${SDK_REF}"
          git push

  packaged-apk:
    name: Build APK and assert all ABIs inside
    needs: build-slices
    if: ${{ inputs.build_apk == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: npm
          package-manager-cache: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Download freshly built slices into the plugin
        uses: actions/download-artifact@v6
        with:
          name: phonebuddy-jniLibs-${{ github.sha }}
          path: ${{ env.JNI_LIBS }}

      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew

      - name: Stage trusted UI and sync native projects
        run: npm run ci:android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 assembleDebug

      - name: Assert the APK really carries every ABI
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n1)"
          test -n "$apk"
          tools/agent-ffi/verify-abis.sh --require-lib libphone_buddy_ffi.so --strict --apk "$apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: phonebuddy-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
